name: CI

on:
  push:
    branches: [MAIN, develop]
  pull_request:
    branches: [MAIN, develop]
  workflow_dispatch:

env:
  APP_SECRET: ci-secret-non-sensible
  DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
  MAILER_DSN: null://null
  MAILER_EXPEDITEUR: ci@vitrineps.test

jobs:
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip, opcache, bcmath
          coverage: none

      - name: Installer les dependances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Creer la base de test et jouer les migrations
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate --no-interaction

      - name: Lancer la suite PHPUnit
        run: php bin/phpunit

  analyse-statique:
    name: Analyse statique (PHPStan)
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, zip, opcache, bcmath
          coverage: none

      - name: Installer les dependances Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prechauffer le cache dev
        run: php bin/console cache:warmup --env=dev

      - name: Lancer PHPStan
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  build-image:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image PHP
        run: docker build -f docker/php/Dockerfile -t vitrineps-php:ci .

  deploiement:
    name: Deploiement
    runs-on: ubuntu-latest
    needs: [tests, analyse-statique, build-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/MAIN' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Placeholder de deploiement
        run: echo "Deploiement pas encore branche sur un serveur reel, prevu a l'etape 12."
