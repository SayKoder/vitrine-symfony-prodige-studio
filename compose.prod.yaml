networks:
  web:
    external: true

volumes:
  public_assets:
  uploads:

services:
  php:
    environment:
      APP_ENV: prod
      DEFAULT_URI: https://prodige-studio.me
      APP_SECRET: ${APP_SECRET}
      MAILER_DSN: ${MAILER_DSN}
      MAILER_EXPEDITEUR: ${MAILER_EXPEDITEUR}
    volumes:
      - public_assets:/var/www/html/public_shared
      - uploads:/var/www/html/public/uploads
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/www/html/public_shared
        rm -rf /var/www/html/public_shared/*
        cp -a /var/www/html/public/. /var/www/html/public_shared/
        exec docker-php-entrypoint php-fpm
    restart: unless-stopped

  nginx:
    volumes:
      - ./docker/nginx/prod.conf.d:/etc/nginx/conf.d:ro
      - public_assets:/var/www/html/public:ro
      - uploads:/var/www/html/public/uploads:ro
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.vitrineps.rule=Host(`prodige-studio.me`) || Host(`www.prodige-studio.me`)"
      - "traefik.http.routers.vitrineps.entrypoints=websecure"
      - "traefik.http.routers.vitrineps.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vitrineps.middlewares=vitrineps-wwwredirect"
      - "traefik.http.middlewares.vitrineps-wwwredirect.redirectregex.regex=^https://www\\.prodige-studio\\.me/(.*)"
      - "traefik.http.middlewares.vitrineps-wwwredirect.redirectregex.replacement=https://prodige-studio.me/$${1}"
      - "traefik.http.middlewares.vitrineps-wwwredirect.redirectregex.permanent=true"
      - "traefik.http.services.vitrineps.loadbalancer.server.port=80"
    restart: unless-stopped

  database:
    restart: unless-stopped
