nelmio_security:
    csp:
        enforce:
            default-src:
                - 'self'
            script-src:
                - 'self'
            style-src:
                - 'self'
                - 'unsafe-inline'
                - 'https://fonts.googleapis.com'
            font-src:
                - 'self'
                - 'https://fonts.gstatic.com'
            img-src:
                - 'self'
            connect-src:
                - 'self'
            base-uri:
                - 'self'
            form-action:
                - 'self'
            frame-ancestors:
                - 'none'
